<!DOCTYPE html>
<html>
<head>
    <title>Airport Pickup Dispatch</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial; background: #f4f6f8; padding: 15px; max-width: 900px; margin: auto; }
        h1 { text-align: center; }
        .card { background: white; padding: 18px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        label { font-weight: bold; display:block; margin-top:10px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; font-size: 16px; }
        button { background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .complete { background: #2e7d32; }
        .delete { background: #e53935; }
        .pickup-card { background:white; padding:15px; border-radius:8px; margin-bottom:15px; box-shadow:0 2px 6px rgba(0,0,0,0.1); position: relative; transition: all 0.3s ease; }
        .pickup-header { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .status { font-weight: bold; margin-top: 5px; }
        .requested { color: #f57c00; }
        .collected { color: #1976d2; }
        .completed { color: #2e7d32; }
        .deleted-status { color: #e53935; }
        .actions { display:flex; gap:10px; margin-top:10px; }
        .actions button { flex:1; }
        .countdown { font-weight: bold; margin-top:5px; }
        .urgent { border-left:5px solid #f57c00; }
        .imminent { border-left:5px solid #e53935; }
        .late { border-left:5px solid #d32f2f; background: #ffe6e6; }
        @keyframes blink { 0% { background-color: #ffe6e6; } 50% { background-color: #ffcccc; } 100% { background-color: #ffe6e6; } }
        .late.blink { animation: blink 1s infinite; }
        #installButton { display:none; margin-bottom:15px; background:#4caf50; }
    </style>
</head>

<body>
<h1>Airport Pickup Dispatch</h1>
<button id="installButton">Install App</button>

<div class="card">
    <h2>Confirm Pickup</h2>
    <label for="type">Type</label>
    <select id="type" onchange="toggleStand()">
        <option value="Inbound">Inbound</option>
        <option value="Outbound">Outbound</option>
    </select>

    <label for="flight">Flight Number</label>
    <input id="flight" placeholder="Flight Number">

    <label for="stand">Stand / Pickup Location</label>
    <input id="stand" placeholder="Stand / Pickup Location">

    <label for="time">Date and Time of Request</label>
    <input type="datetime-local" id="time">

    <label for="crew">Number of Crew</label>
    <select id="crew">
        <option value="">Crew Number</option>
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
    </select>

    <button onclick="confirmPickup()">Confirm Pickup</button>
</div>

<div class="card">
    <h2>Active Pickups</h2>
    <button style="background:#ff9800; margin-bottom:10px;" onclick="resetAlerts()">Reset Alerts</button>
    <div id="dashboard"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// --- Firebase Config ---
const firebaseConfig = {
    apiKey: "AIzaSyCCehxMag_g2wXh7WzruvZyt9kdSJI4OpI",
    authDomain: "crew-app-e1315.firebaseapp.com",
    projectId: "crew-app-e1315",
    storageBucket: "crew-app-e1315.appspot.com",
    messagingSenderId: "320647227664",
    appId: "1:320647227664:web:8de65c96c509d819a7dd95",
    databaseURL: "https://crew-app-e1315-default-rtdb.europe-west1.firebasedatabase.app/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pickupsRef = ref(db, "pickups1");
const auditRef = ref(db, "auditLogs");
const dashboard = document.getElementById("dashboard");

// --- Anonymous Auth ---
const auth = getAuth();
signInAnonymously(auth)
    .then(() => console.log("Signed in anonymously"))
    .catch(err => console.error("Anonymous auth failed:", err));

// --- Google Sheets Web App URL ---
const SHEETS_URL = "https://script.google.com/macros/s/AKfycbxfHH1dcm4o8Pu_GUyaRBXBImw5p1QCyYlwPX_5VcXBlsIG0qsqp1PRO0MX0kv2JPON6A/exec";

// --- Helpers ---
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

window.toggleStand = function() {
    document.getElementById("stand").style.display =
        document.getElementById("type").value === "Inbound" ? "block" : "none";
};
toggleStand();

function formatMinutesDiff(start, end) {
    if (!start || !end) return "";
    const diff = (new Date(end) - new Date(start)) / 60000;
    return Number.isFinite(diff) ? diff.toFixed(1) : "";
}

// --- Audit log helper ---
async function logAudit(jobId, action, jobData) {
    const t = jobData.timestamps || {};
    const auditEntry = {
        jobId,
        action,
        crew: jobData.crew || "",
        stand: jobData.stand || "",
        type: jobData.type || "",
        flightNumber: jobData.flightNumber || "",
        status: jobData.status || "",
        pickupTime: jobData.pickupTime || "",
        created: t.created || "",
        requested: t.requested || "",
        collected: t.collected || "",
        completed: t.completed || "",
        deleted: t.deleted || "",
        requestToCollect: formatMinutesDiff(t.requested, t.collected),
        collectToComplete: formatMinutesDiff(t.collected, t.completed),
        timestamp: new Date().toISOString()
    };
    await push(auditRef, auditEntry);
}

// --- Google Sheets sync ---
async function sendToSheets(jobId, job) {
    try {
        const t = job.timestamps || {};

        const payload = {
            jobId,
            flightNumber: job.flightNumber || "",
            crew: job.crew || "",
            stand: job.stand || "",
            type: job.type || "",
            pickupTime: job.pickupTime || "",
            status: job.status || "",
            created: t.created || "",
            requested: t.requested || "",
            collected: t.collected || "",
            completed: t.completed || "",
            deleted: t.deleted || "",
            requestToCollect: formatMinutesDiff(t.requested, t.collected),
            collectToComplete: formatMinutesDiff(t.collected, t.completed),
            lastUpdated: new Date().toISOString()
        };

        const url = `${SHEETS_URL}?payload=${encodeURIComponent(JSON.stringify(payload))}`;
        console.log("Calling Sheets URL", url);

        const response = await fetch(url, {
            method: "GET",
            cache: "no-store"
        });

        const text = await response.text();
        console.log("Sheets response status:", response.status);
        console.log("Sheets response body:", text);

        if (!response.ok) {
            throw new Error(`Sheets sync failed: ${response.status} ${text}`);
        }
    } catch (e) {
        console.error("Failed to send to Google Sheets:", e);
    }
}

// --- Confirm Pickup ---
window.confirmPickup = async function() {
    const flight = document.getElementById("flight").value.trim();
    const type = document.getElementById("type").value;
    const stand = document.getElementById("stand").value.trim();
    const timeInput = document.getElementById("time").value;
    const crew = document.getElementById("crew").value;

    if (!flight || !timeInput || !crew) {
        alert("Enter flight, time, and crew");
        return;
    }

    if (type === "Inbound" && !stand) {
        alert("Enter stand for inbound");
        return;
    }

    const pickupTime = new Date(timeInput);
    if (isNaN(pickupTime)) {
        alert("Invalid date/time");
        return;
    }

    const now = new Date().toISOString();

    const newJob = {
        flightNumber: flight,
        type,
        stand,
        pickupTime: pickupTime.toISOString(),
        crew,
        status: "Requested",
        timestamps: {
            created: now,
            requested: now,
            collected: null,
            completed: null,
            deleted: null
        }
    };

    try {
        console.log("CREATING JOB:", newJob);

        const jobRef = await push(pickupsRef, newJob);
        console.log("FIREBASE JOB ID:", jobRef.key);

        await logAudit(jobRef.key, "Created", newJob);
        console.log("AUDIT LOGGED");

        await sendToSheets(jobRef.key, newJob);
        console.log("NEW JOB SENT OK");

        document.getElementById("flight").value = "";
        document.getElementById("stand").value = "";
        document.getElementById("time").value = "";
        document.getElementById("crew").value = "";
    } catch (err) {
        console.error("Failed to add pickup:", err);
        alert("Error adding pickup, see console");
    }
};

// --- Collected / Complete / Delete ---
window.collected = async id => {
    try {
        console.log("COLLECTED clicked for", id);

        const now = new Date().toISOString();
        const snap = await get(ref(db, "pickups1/" + id));
        const existingJob = snap.val();

        if (!existingJob) {
            throw new Error("Job not found in Firebase");
        }

        const updatedJob = {
            ...existingJob,
            status: "Collected",
            timestamps: {
                ...(existingJob.timestamps || {}),
                collected: now
            }
        };

        await update(ref(db, "pickups1/" + id), {
            status: "Collected",
            "timestamps/collected": now
        });

        console.log("Firebase updated");

        await logAudit(id, "Collected", updatedJob);
        await sendToSheets(id, updatedJob);

        console.log("Collected sent to Sheets", updatedJob);
    } catch (err) {
        console.error("Collected update failed:", err);
    }
};

window.complete = async id => {
    try {
        console.log("COMPLETE clicked for", id);

        const now = new Date().toISOString();
        const snap = await get(ref(db, "pickups1/" + id));
        const existingJob = snap.val();

        if (!existingJob) {
            throw new Error("Job not found in Firebase");
        }

        const updatedJob = {
            ...existingJob,
            status: "Completed",
            timestamps: {
                ...(existingJob.timestamps || {}),
                completed: now
            }
        };

        await update(ref(db, "pickups1/" + id), {
            status: "Completed",
            "timestamps/completed": now
        });

        console.log("Firebase updated");

        await logAudit(id, "Completed", updatedJob);
        await sendToSheets(id, updatedJob);

        console.log("Completed sent to Sheets", updatedJob);
    } catch (err) {
        console.error("Complete update failed:", err);
    }
};

window.removePickup = async id => {
    const ok = confirm("Are you sure you want to delete this job?");
    if (!ok) return;

    try {
        console.log("DELETE clicked for", id);

        const now = new Date().toISOString();
        const snap = await get(ref(db, "pickups1/" + id));
        const existingJob = snap.val();

        if (!existingJob) {
            throw new Error("Job not found in Firebase");
        }

        const updatedJob = {
            ...existingJob,
            status: "Deleted",
            timestamps: {
                ...(existingJob.timestamps || {}),
                deleted: now
            }
        };

        await update(ref(db, "pickups1/" + id), {
            status: "Deleted",
            "timestamps/deleted": now
        });

        console.log("Firebase updated");

        await logAudit(id, "Deleted", updatedJob);
        await sendToSheets(id, updatedJob);

        console.log("Deleted sent to Sheets", updatedJob);
    } catch (err) {
        console.error("Delete update failed:", err);
    }
};

// --- Reset Alerts ---
window.resetAlerts = function() {
    Array.from(document.getElementsByClassName("pickup-card")).forEach(card => {
        card.classList.remove("blink");
        card.dataset.alerted = "false";
    });
};

// --- Live pickups ---
onValue(pickupsRef, snapshot => {
    const pickups = [];
    const now = new Date();

    snapshot.forEach(child => {
        const data = { id: child.key, ...child.val() };
        pickups.push(data);
    });

    pickups.sort((a, b) => {
        const aTime = new Date(a.pickupTime);
        const bTime = new Date(b.pickupTime);

        const getPriority = (p, time) => {
            if (p.status !== "Requested") return 4;
            if (isNaN(time)) return 4;
            const diff = (time - now) / 60000;
            if (diff < 0) return 0;
            if (diff <= 10) return 1;
            if (diff <= 30) return 2;
            return 3;
        };

        return getPriority(a, aTime) - getPriority(b, bTime) || aTime - bTime;
    });

    dashboard.innerHTML = "";

    pickups.forEach(p => {
        if (p.status === "Completed" || p.status === "Deleted") return;

        const card = document.createElement("div");
        card.className = "pickup-card";
        card.dataset.pickupTime = p.pickupTime;
        card.dataset.status = p.status;
        card.dataset.alerted = "false";

        const pickupDate = new Date(p.pickupTime);
        const statusClass =
            p.status === "Collected" ? "collected" :
            p.status === "Completed" ? "completed" :
            p.status === "Deleted" ? "deleted-status" : "requested";

        card.innerHTML = `
            <div class="pickup-header">${p.flightNumber}</div>
            <div>${p.type}${p.stand ? " – Stand " + p.stand : ""}</div>
            <div class="pickup-time">Pickup: ${isNaN(pickupDate) ? "Invalid date" : pickupDate.toLocaleString()}</div>
            <div>Crew: ${p.crew}</div>
            <div class="status ${statusClass}">${p.status}</div>
            <div class="countdown"></div>
            <div class="actions">
                ${p.status === "Requested" ? `<button onclick="collected('${p.id}')">Collected</button>` : ""}
                ${p.status === "Collected" ? `<button class="complete" onclick="complete('${p.id}')">Complete</button>` : ""}
                <button class="delete" onclick="removePickup('${p.id}')">Delete Job (no show)</button>
            </div>
        `;
        dashboard.appendChild(card);
    });

    updateCountdowns();
});

// --- Countdown ---
function updateCountdowns() {
    const cards = Array.from(document.getElementsByClassName("pickup-card"));
    const now = new Date();

    cards.forEach(card => {
        const status = card.dataset.status;
        const countdownEl = card.querySelector(".countdown");
        const pickupTime = new Date(card.dataset.pickupTime);

        if (!card.dataset.pickupTime || isNaN(pickupTime)) {
            countdownEl.textContent = "Invalid pickup time";
            card.classList.remove("imminent", "urgent", "late", "blink");
            card.dataset.alerted = "false";
            return;
        }

        if (status !== "Requested") {
            countdownEl.textContent = "";
            card.classList.remove("imminent", "urgent", "late", "blink");
            return;
        }

        const diffSeconds = Math.floor((pickupTime - now) / 1000);

        if (diffSeconds < 0) {
            countdownEl.textContent = "Late!";
            card.classList.remove("imminent", "urgent");
            card.classList.add("late", "blink");
            card.dataset.alerted = "true";
        } else {
            const minutes = Math.floor(diffSeconds / 60);
            const seconds = diffSeconds % 60;
            countdownEl.textContent = `Time left: ${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')} min`;
            card.classList.remove("imminent", "urgent", "late", "blink");
            if (minutes <= 10) card.classList.add("imminent");
            else if (minutes <= 30) card.classList.add("urgent");
            card.dataset.alerted = "false";
        }
    });
}
setInterval(updateCountdowns, 1000);

// --- PWA install ---
let deferredPrompt;
const installButton = document.getElementById("installButton");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installButton.style.display = "block";
});

installButton.addEventListener("click", async () => {
    installButton.style.display = "none";
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
});

// --- Service Worker ---
if ("serviceWorker" in navigator) {
   if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(reg => reg.unregister());
    });
}
</script>
</body>
</html>
